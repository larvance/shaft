[workspace]
members = [
    "crates/shaft-core",
    "crates/shaft-image",
    "crates/shaft-audio",
    "crates/shaft-video",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Larvance"]
license = "MIT"
repository = "https://github.com/larvance/shaft"

[workspace.dependencies]
shaft-core = { path = "crates/shaft-core" }
shaft-image = { path = "crates/shaft-image" }
shaft-audio = { path = "crates/shaft-audio" }
shaft-video = { path = "crates/shaft-video" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "fs", "net", "io-util"] }
rayon = "1.10"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico", "bmp", "tiff"] }
resvg = "0.44"
tiny-skia = "0.11"

mime_guess = "2.0"
walkdir = "2.5"
rfd = "0.15"

[profile.dev]
opt-level = 0
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

[profile.test]
opt-level = 1
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false
